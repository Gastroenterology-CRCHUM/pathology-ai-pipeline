<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="420" fill="#ffffff"/>

  <!-- Step 1: Pathology report -->
  <rect x="20" y="160" width="150" height="100" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="95" y="200" text-anchor="middle" font-size="14" font-weight="600" fill="#312e81">Pathology</text>
  <text x="95" y="218" text-anchor="middle" font-size="14" font-weight="600" fill="#312e81">report text</text>
  <text x="95" y="240" text-anchor="middle" font-size="11" fill="#4338ca">(+ target specimen</text>
  <text x="95" y="253" text-anchor="middle" font-size="11" fill="#4338ca">segment / local order)</text>

  <line x1="170" y1="210" x2="212" y2="210" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: LLM extraction -->
  <rect x="215" y="150" width="170" height="120" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="300" y="190" text-anchor="middle" font-size="14" font-weight="600" fill="#065f46">LLM extraction</text>
  <text x="300" y="208" text-anchor="middle" font-size="11" fill="#047857">Qwen 2.5 72B, temp 0.1</text>
  <text x="300" y="224" text-anchor="middle" font-size="11" fill="#047857">prompt.py -&gt; build_prompt()</text>
  <text x="300" y="248" text-anchor="middle" font-size="11" fill="#047857">returns: specimen match,</text>
  <text x="300" y="261" text-anchor="middle" font-size="11" fill="#047857">code(s), diagnosis text</text>

  <line x1="385" y1="210" x2="427" y2="210" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: Validation rules -->
  <rect x="430" y="140" width="190" height="140" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="525" y="168" text-anchor="middle" font-size="14" font-weight="600" fill="#9a3412">Deterministic</text>
  <text x="525" y="186" text-anchor="middle" font-size="14" font-weight="600" fill="#9a3412">validation rules</text>
  <text x="525" y="208" text-anchor="middle" font-size="10.5" fill="#c2410c">1. high-stakes (HGD/Ca)</text>
  <text x="525" y="222" text-anchor="middle" font-size="10.5" fill="#c2410c">2. impossible combination</text>
  <text x="525" y="236" text-anchor="middle" font-size="10.5" fill="#c2410c">3. multi-specimen warning</text>
  <text x="525" y="250" text-anchor="middle" font-size="10.5" fill="#c2410c">4. IHC + no specimen</text>
  <text x="525" y="266" text-anchor="middle" font-size="10.5" fill="#c2410c">else: accept as-is</text>

  <!-- Branch down: diverted -->
  <line x1="525" y1="280" x2="525" y2="330" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="430" y="333" width="190" height="60" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="525" y="358" text-anchor="middle" font-size="12.5" font-weight="600" fill="#991b1b">Diverted</text>
  <text x="525" y="376" text-anchor="middle" font-size="11" fill="#b91c1c">-&gt; human (pathologist) review</text>

  <!-- Branch right: accepted -->
  <line x1="620" y1="210" x2="662" y2="210" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="641" y="200" text-anchor="middle" font-size="10" fill="#4a5568">accepted</text>

  <!-- Step 4: USMSTF/ESGE -->
  <rect x="665" y="150" width="150" height="120" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="740" y="185" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">USMSTF /</text>
  <text x="740" y="203" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">ESGE rules</text>
  <text x="740" y="225" text-anchor="middle" font-size="11" fill="#1d4ed8">usmstf.py</text>
  <text x="740" y="240" text-anchor="middle" font-size="11" fill="#1d4ed8">esge.py</text>
  <text x="740" y="258" text-anchor="middle" font-size="10.5" fill="#1d4ed8">(per-exam calculators)</text>

  <line x1="815" y1="210" x2="857" y2="210" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5: Recommendation -->
  <rect x="860" y="160" width="100" height="100" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="910" y="198" text-anchor="middle" font-size="13" font-weight="600" fill="#5b21b6">Surveillance</text>
  <text x="910" y="216" text-anchor="middle" font-size="13" font-weight="600" fill="#5b21b6">interval</text>
  <text x="910" y="238" text-anchor="middle" font-size="10.5" fill="#6d28d9">(e.g. "3yr",</text>
  <text x="910" y="251" text-anchor="middle" font-size="10.5" fill="#6d28d9">"7-10yr")</text>

  <!-- stats footer -->
  <rect x="215" y="330" width="600" height="60" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="515" y="354" text-anchor="middle" font-size="11.5" fill="#334155">stats.py: precision / recall / F1 per category, micro &amp; macro F1,</text>
  <text x="515" y="372" text-anchor="middle" font-size="11.5" fill="#334155">cluster-bootstrap &amp; Wilson score confidence intervals - used to evaluate the pipeline above against a reference standard</text>

  <text x="490" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">Pipeline overview</text>
  <text x="490" y="48" text-anchor="middle" font-size="11.5" fill="#6b7280">one polyp-level target per pass; diverted targets are excluded from automated-recall / surveillance calculations</text>
</svg>
